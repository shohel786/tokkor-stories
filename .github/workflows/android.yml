
name: Build Tokkor Stories APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q "Tokkor stories.zip" -d project

      - name: Build APK
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find project -name settings.gradle -print -quit)
          fi
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tokkor-Stories-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
