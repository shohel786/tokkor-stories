name: Build Tokkor Stories APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tokkor-stories.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q tokkor-stories.zip -d project
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          test -f gradle/wrapper/gradle-wrapper.jar
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tokkor-Stories-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
